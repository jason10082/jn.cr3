    <!-- UPDATED SCRIPT: Matches the new slide-out mobile menu mechanics -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navContainer = document.getElementById('nav-container');
        const closeMenu = document.getElementById('close-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const navItems = document.querySelectorAll('.nav-item');

        function toggleMenu() {
            navContainer.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.style.overflow = navContainer.classList.contains('active') ? 'hidden' : 'auto';
        }

        function closeMenuFunc() {
            navContainer.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        hamburger.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', closeMenuFunc);
        menuOverlay.addEventListener('click', closeMenuFunc);
        navItems.forEach(item => item.addEventListener('click', closeMenuFunc));
    </script>
